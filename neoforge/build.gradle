apply from: "https://raw.githubusercontent.com/SteveKunG/GradleScripts/refs/heads/v2/architectury/neoforge.gradle"

loom {
    runs.configureEach {
        properties project.commonProperties
        vmArgs project.commonVmArgs
        vmArgs project.hotswapVmArgs
    }

    runs {
        client {
            if (project.hasProperty("usernameAndUUID")) {
                programArgs project.usernameAndUUID
            }
        }
    }
}

dependencies {
    include(implementation("com.moulberry:mixinconstraints:${mixin_constraints_version}"))
}

String fileName = "${archives_base_name}-mc${minecraft_version}"
List<String> devExcludes = ["**/debug/"]

jar {
    excludes = devExcludes
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()       // Remove default source set inclusion
    from zipTree(jar.archiveFile)     // Unpack jar output (preserves Loom modifications)

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge" + (release_type != "release" ? "-${release_type}" : "")
    archiveVersion = "v${mod_version}"
    archiveBaseName = fileName
}